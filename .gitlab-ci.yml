stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  API_IMAGE: $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA
  API_LATEST: $CI_REGISTRY_IMAGE/api:latest
  WEB_IMAGE: $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA
  WEB_LATEST: $CI_REGISTRY_IMAGE/web:latest

# ==============================================================================
# TEST STAGE
# ==============================================================================

test:backend:
  stage: test
  image: php:8.2-cli-alpine
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: ion_livechat_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ion_livechat_test
    DB_USERNAME: test_user
    DB_PASSWORD: test_password
    REDIS_HOST: redis
    APP_ENV: testing
    APP_KEY: base64:XG8o0uT6kX9qX67b7uO1Q8Z3HlZ/tqfK1lI5jZ4rZ1A=
  before_script:
    - apk add --no-cache postgresql-dev libzip-dev zip unzip git $PHPIZE_DEPS
    - docker-php-ext-install pdo pdo_pgsql pgsql pcntl opcache bcmath sockets zip
    - pecl install redis && docker-php-ext-enable redis
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - cd apps/api
    - composer install --no-interaction --prefer-dist
    - php artisan test --parallel

test:frontend:
  stage: test
  image: node:20-alpine
  before_script:
    - cd packages/types && npm ci && npm run build && cd ../..
    - cd apps/web && npm ci
  script:
    - cd apps/web
    - npx tsc --noEmit
    - npm run build

# ==============================================================================
# BUILD STAGE (Docker Registry Push)
# ==============================================================================

build:containers:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # Build & push API container
    - docker build -t $API_IMAGE -t $API_LATEST -f infrastructure/docker/api/Dockerfile .
    - docker push $API_IMAGE
    - docker push $API_LATEST
    # Build & push Web container
    - docker build -t $WEB_IMAGE -t $WEB_LATEST -f infrastructure/docker/web/Dockerfile .
    - docker push $WEB_IMAGE
    - docker push $WEB_LATEST
  only:
    - main

# ==============================================================================
# DEPLOY STAGE
# ==============================================================================

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
  script:
    - echo "Deploying commit $CI_COMMIT_SHA to production host..."
    - |
      if [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_HOST" ]; then
        eval $(ssh-agent -s)
        echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/ion-livechat && docker compose pull && docker compose up -d"
      else
        echo "No SSH credentials configured, skipping remote execution."
      fi
  only:
    - main
  when: manual
