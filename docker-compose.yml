services:
  postgres:
    image: postgres:16-alpine
    container_name: ion_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ion_livechat}
      POSTGRES_USER: ${DB_USERNAME:-ion_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ion_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ion_user} -d ${DB_DATABASE:-ion_livechat}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ion-network

  redis:
    image: redis:7-alpine
    container_name: ion_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ion-network

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    container_name: ion_api
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: app
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-base64:XG8o0uT6kX9qX67b7uO1Q8Z3HlZ/tqfK1lI5jZ4rZ1A=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://livechat.zayra.web.id}
      FRONTEND_URL: ${FRONTEND_URL:-https://livechat.zayra.web.id}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ion_livechat}
      DB_USERNAME: ${DB_USERNAME:-ion_user}
      DB_PASSWORD: ${DB_PASSWORD:-ion_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-ionlivechat}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-ionlivechatkey}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-ionlivechatsecret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RUN_SEEDERS:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://livechat.zayra.web.id/api/v1/auth/oauth/google/callback}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-https://livechat.zayra.web.id/api/v1/auth/oauth/facebook/callback}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app/public
    networks:
      - ion-network

  reverb:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    container_name: ion_reverb
    restart: unless-stopped
    command: ["reverb"]
    environment:
      CONTAINER_ROLE: reverb
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-base64:XG8o0uT6kX9qX67b7uO1Q8Z3HlZ/tqfK1lI5jZ4rZ1A=}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ion_livechat}
      DB_USERNAME: ${DB_USERNAME:-ion_user}
      DB_PASSWORD: ${DB_PASSWORD:-ion_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-ionlivechat}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-ionlivechatkey}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-ionlivechatsecret}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_APP_PING_INTERVAL: ${REVERB_APP_PING_INTERVAL:-25}
      REVERB_APP_ACTIVITY_TIMEOUT: ${REVERB_APP_ACTIVITY_TIMEOUT:-15}
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - ion-network

  queue:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    container_name: ion_queue
    restart: unless-stopped
    command: ["queue"]
    environment:
      CONTAINER_ROLE: queue
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-base64:XG8o0uT6kX9qX67b7uO1Q8Z3HlZ/tqfK1lI5jZ4rZ1A=}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ion_livechat}
      DB_USERNAME: ${DB_USERNAME:-ion_user}
      DB_PASSWORD: ${DB_PASSWORD:-ion_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - ion-network

  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    container_name: ion_scheduler
    restart: unless-stopped
    command: ["scheduler"]
    environment:
      CONTAINER_ROLE: scheduler
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-base64:XG8o0uT6kX9qX67b7uO1Q8Z3HlZ/tqfK1lI5jZ4rZ1A=}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ion_livechat}
      DB_USERNAME: ${DB_USERNAME:-ion_user}
      DB_PASSWORD: ${DB_PASSWORD:-ion_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - ion-network

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_REVERB_KEY: ${REVERB_APP_KEY:-ionlivechatkey}
        NEXT_PUBLIC_REVERB_HOST: ${PUBLIC_HOST:-livechat.zayra.web.id}
        NEXT_PUBLIC_REVERB_PORT: ${PUBLIC_PORT:-443}
        NEXT_PUBLIC_REVERB_SCHEME: ${PUBLIC_SCHEME:-https}
    container_name: ion_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_REVERB_KEY: ${REVERB_APP_KEY:-ionlivechatkey}
      NEXT_PUBLIC_REVERB_HOST: ${PUBLIC_HOST:-livechat.zayra.web.id}
      NEXT_PUBLIC_REVERB_PORT: ${PUBLIC_PORT:-443}
      NEXT_PUBLIC_REVERB_SCHEME: ${PUBLIC_SCHEME:-https}
    depends_on:
      - api
    networks:
      - ion-network

  nginx:
    image: nginx:alpine
    container_name: ion_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8888}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - api
      - reverb
    networks:
      - ion-network

networks:
  ion-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  storage_data:
