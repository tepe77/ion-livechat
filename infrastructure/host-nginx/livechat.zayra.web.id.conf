# ==============================================================================
# NGINX Configuration for Host VM
# Domain: livechat.zayra.web.id
# Target: Docker Container Gateway on 127.0.0.1:8888
#
# Instructions:
# 1. Copy this file to: /etc/nginx/sites-available/livechat.zayra.web.id
# 2. Enable it: sudo ln -s /etc/nginx/sites-available/livechat.zayra.web.id /etc/nginx/sites-enabled/
# 3. Test config: sudo nginx -t
# 4. Generate SSL with Certbot:
#    sudo certbot --nginx -d livechat.zayra.web.id
# ==============================================================================

# WebSocket Connection Upgrade Mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP Server: Redirect all traffic to HTTPS (Certbot will automatically manage this block)
server {
    listen 80;
    listen [::]:80;
    server_name livechat.zayra.web.id;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server: Reverse Proxy to Docker Compose Gateway (127.0.0.1:8888)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name livechat.zayra.web.id;

    # SSL Certificates (managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/livechat.zayra.web.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/livechat.zayra.web.id/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security & Performance Settings
    client_max_body_size 100M;
    keepalive_timeout 65;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Forward all traffic to Docker Gateway
    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers (Crucial for Laravel Reverb & Next.js)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Real Client IP & Host Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Timeouts for persistent WebSocket connections
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Buffering
        proxy_buffering off;
        proxy_redirect off;
    }
}
